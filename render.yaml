# TerrainSN — Blueprint Render (plan gratuit / Node natif)
# Dashboard → New → Blueprint → ce repo → branche MOHAMED_COULIBALY → Apply
# Doc : DEPLOY_RENDER.md
#
# Plan free : pas de disque persistant (SQLite + seed à chaque machine neuve).
# Pour Docker + disque : voir Dockerfile (plan Starter).
#
# Secrets à renseigner dans le dashboard (sync: false) :
# WhatsApp : WHATSAPP_MOCK=false, OPENWA_API_KEY, OPENWA_SHARED_SESSION_ID, APP_DOMAIN
# Paiements prod : PAYTECH_MOCK=false, PAYMENT_MODE=production, PAYMENT_PROVIDER=paytech,
#   PAYTECH_ENV=prod, PAYTECH_API_KEY, PAYTECH_API_SECRET
# (APP_DOMAIN / RENDER_EXTERNAL_URL suffit pour IPN — plus besoin de ngrok)

services:
  - type: web
    name: terrainsn
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SKIP_SEED
        value: "false"
      - key: FORCE_SEED
        value: "false"
      # WhatsApp — secrets dashboard
      - key: WHATSAPP_MOCK
        sync: false
      - key: OPENWA_API_KEY
        sync: false
      - key: OPENWA_BASE_URL
        sync: false
      - key: OPENWA_SESSION_PREFIX
        sync: false
      - key: OPENWA_SHARED_SESSION_ID
        sync: false
      - key: OPENWA_PLATFORM_SESSION_ID
        sync: false
      - key: APP_DOMAIN
        sync: false
      # Paiements — ne plus forcer simulation (dashboard)
      - key: PAYTECH_MOCK
        sync: false
      - key: PAYMENT_MODE
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYTECH_ENV
        sync: false
      - key: PAYTECH_API_KEY
        sync: false
      - key: PAYTECH_API_SECRET
        sync: false
      - key: PAYDUNYA_MODE
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: VAPID_SUBJECT
        value: mailto:contact@terrainsn.com
