# TerrainSN — Blueprint Render (plan gratuit / Node natif)
# Dashboard → New → Blueprint → ce repo → branche MOHAMED_COULIBALY → Apply
# Doc : DEPLOY_RENDER.md
#
# Plan free : pas de disque persistant (SQLite + seed à chaque machine neuve).
# Pour Docker + disque : voir Dockerfile (plan Starter).
#
# Domaine prod canonique : https://terraisn1-1.onrender.com
# Secrets dashboard (sync: false) : WhatsApp OPENWA_*, clés PayTech, VAPID
# Doc : DEPLOY_RENDER.md

services:
  - type: web
    name: terrainsn
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SKIP_SEED
        value: "false"
      - key: FORCE_SEED
        value: "false"
      - key: APP_DOMAIN
        value: https://terraisn1-1.onrender.com
      - key: CORS_ORIGINS
        value: https://terraisn1-1.onrender.com
      - key: PAYTECH_IPN_URL
        value: https://terraisn1-1.onrender.com/webhook/paytech
      - key: PAYTECH_SUCCESS_URL
        value: https://terraisn1-1.onrender.com/paytech/success
      - key: PAYTECH_CANCEL_URL
        value: https://terraisn1-1.onrender.com/paytech/cancel
      - key: WHATSAPP_MOCK
        sync: false
      - key: OPENWA_API_KEY
        sync: false
      - key: OPENWA_BASE_URL
        sync: false
      - key: OPENWA_SESSION_PREFIX
        sync: false
      - key: OPENWA_SHARED_SESSION_ID
        sync: false
      - key: OPENWA_PLATFORM_SESSION_ID
        sync: false
      - key: WHATSAPP_DEV_NUMBER
        sync: false
      - key: PAYTECH_MOCK
        sync: false
      - key: PAYMENT_MODE
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYTECH_ENV
        sync: false
      - key: PAYTECH_API_KEY
        sync: false
      - key: PAYTECH_API_SECRET
        sync: false
      - key: PAYTECH_PAYOUT_ENABLED
        sync: false
      - key: PAYTECH_PAYOUT_URL
        sync: false
      - key: PAYDUNYA_MODE
        sync: false
      - key: PAYDUNYA_PAYOUT_ENABLED
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: VAPID_SUBJECT
        value: mailto:contact@terrainsn.com
      # Domaines front (mono-host : APP_DOMAIN_PRO = APP_DOMAIN + /pro)
      # À surcharger dans le dashboard avec l'URL réelle du service :
      # APP_DOMAIN=https://xxx.onrender.com
      # APP_DOMAIN_JOUEUR=https://xxx.onrender.com
      # APP_DOMAIN_PRO=https://xxx.onrender.com/pro
      # CORS_ORIGINS=https://xxx.onrender.com
