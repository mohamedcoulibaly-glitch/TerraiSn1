# TerrainSN — Blueprint Render (plan gratuit / Node natif)
# Dashboard → New → Blueprint → ce repo → branche MOHAMED_COULIBALY → Apply
# Doc : DEPLOY_RENDER.md
#
# Plan free : pas de disque persistant (SQLite + seed à chaque machine neuve).
# Pour Docker + disque : voir Dockerfile (plan Starter).

services:
  - type: web
    name: terrainsn
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SKIP_SEED
        value: "false"
      - key: FORCE_SEED
        value: "false"
      - key: WHATSAPP_MOCK
        value: "true"
      - key: PAYTECH_MOCK
        value: "true"
      - key: PAYMENT_MODE
        value: simulation
      - key: PAYMENT_PROVIDER
        value: paydunya
      - key: PAYDUNYA_MODE
        value: test
      - key: PAYTECH_ENV
        value: test
      - key: COOKIE_SAMESITE
        value: lax
      - key: VAPID_SUBJECT
        value: mailto:contact@terrainsn.com
