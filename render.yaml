# TerrainSN — Blueprint Render (plan gratuit / Node natif)
# Dashboard → New → Blueprint → ce repo → branche MOHAMED_COULIBALY → Apply
# Doc : DEPLOY_RENDER.md
#
# Plan free : pas de disque persistant (SQLite + seed à chaque machine neuve).
# Pour Docker + disque : voir Dockerfile (plan Starter).
#
# WhatsApp prod : dans le dashboard Render, définir au minimum :
#   WHATSAPP_MOCK=false
#   OPENWA_API_KEY=… (secret)
#   OPENWA_BASE_URL=https://mywa.tickets-place.net
#   OPENWA_SHARED_SESSION_ID=… (UUID session OpenWA déjà connectée — recommandé)
#   APP_DOMAIN=https://<ton-service>.onrender.com

services:
  - type: web
    name: terrainsn
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SKIP_SEED
        value: "false"
      - key: FORCE_SEED
        value: "false"
      # Ne pas forcer le mock : à renseigner dans le dashboard (false pour prod réelle)
      - key: WHATSAPP_MOCK
        sync: false
      - key: OPENWA_API_KEY
        sync: false
      - key: OPENWA_BASE_URL
        sync: false
      - key: OPENWA_SESSION_PREFIX
        sync: false
      - key: OPENWA_SHARED_SESSION_ID
        sync: false
      - key: OPENWA_PLATFORM_SESSION_ID
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: PAYTECH_MOCK
        value: "true"
      - key: PAYMENT_MODE
        value: simulation
      - key: PAYMENT_PROVIDER
        value: paydunya
      - key: PAYDUNYA_MODE
        value: test
      - key: PAYTECH_ENV
        value: test
      - key: COOKIE_SAMESITE
        value: lax
      - key: VAPID_SUBJECT
        value: mailto:contact@terrainsn.com
