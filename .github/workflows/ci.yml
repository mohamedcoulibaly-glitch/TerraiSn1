name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend — tests + API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      WHATSAPP_MOCK: 'true'
      PAYTECH_MOCK: 'true'
      PAYMENT_MODE: simulation
      SKIP_SEED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests métier (paiements, gérant, kanban, check-in)
        run: npm test

      - name: Démarrer l'API (smoke)
        run: |
          node index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              echo "API healthy after ${i}s"
              curl -fsS http://127.0.0.1:3001/health
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "API n'a pas répondu sur /health"
            cat /tmp/api.log || true
            kill "$(cat /tmp/api.pid)" || true
            exit 1
          fi
          kill "$(cat /tmp/api.pid)" || true

      - name: Audit npm (critique seulement, n'échoue pas le job)
        continue-on-error: true
        run: npm audit --audit-level=critical

  frontend:
    name: Frontend — lint, tests, build, PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.terrainsn.com/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests Vitest
        run: npm test

      - name: Icônes PWA
        run: npm run generate-icons

      - name: Build
        run: npm run build

      - name: Audit PWA (manifest, SW, icônes)
        run: npm run audit:pwa

      - name: Publier dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

      - name: Audit npm (critique seulement)
        continue-on-error: true
        run: npm audit --audit-level=critical

  e2e:
    name: E2E — Playwright parcours UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root + frontend
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (chromium)
        run: npx playwright test --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  admin:
    name: Admin — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.terrainsn.com/api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

  lighthouse:
    name: Lighthouse
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Récupérer le build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pwa-report
          path: frontend/.lighthouseci/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker API — build + smoke
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t terrainsn-api:ci ./backend

      - name: Smoke test du conteneur
        run: |
          docker run -d --name terrainsn-api \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e JWT_SECRET=ci-jwt-secret-not-for-production \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-not-for-production \
            -e WHATSAPP_MOCK=true \
            -e PAYTECH_MOCK=true \
            -e PAYMENT_MODE=simulation \
            -e SKIP_SEED=true \
            terrainsn-api:ci
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              echo "Conteneur healthy after ${i}s"
              curl -fsS http://127.0.0.1:3001/health
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "===== logs du conteneur ====="
            docker logs terrainsn-api || true
            docker stop terrainsn-api || true
            exit 1
          fi
          docker stop terrainsn-api

      - name: Image tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/terrainsn-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Buildx
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [frontend, admin]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Déployer sur Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@41
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Vercel non configuré
        if: ${{ secrets.VERCEL_TOKEN == '' || secrets.VERCEL_ORG_ID == '' || secrets.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "::notice::Déploiement Vercel ignoré — ajoutez les secrets VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID (Settings → Secrets and variables → Actions)."
          echo "Si Vercel est déjà branché au repo GitHub, le déploiement Git natif suffit et ces secrets sont optionnels."
