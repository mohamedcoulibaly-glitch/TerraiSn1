<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TerrainSN" />
    <title>TerrainSN — Réserve ton terrain de foot à Dakar</title>
    <meta name="description" content="Réserve ton terrain de foot à Dakar. Paiement Wave et Orange Money.">
    <meta name="keywords" content="terrain, foot, réservation, Dakar, Sénégal, TerrainSN">
    <meta name="author" content="TerrainSN" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png">
    <meta property="og:title" content="TerrainSN — Réserve ton terrain de foot à Dakar">
    <meta property="og:description" content="Réserve ton terrain de foot à Dakar. Paiement Wave et Orange Money.">
    <meta property="og:url" content="https://app.terrainsn.com">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TerrainSN" />
    <meta name="twitter:image" content="/favicon.png">
    <meta name="twitter:title" content="TerrainSN">
    <meta name="twitter:description" content="Réserve ton terrain de foot à Dakar. Paiement Wave et Orange Money.">

    <!-- Polices critiques — preload + stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    >

    <!-- Icônes de navigation PWA / splash -->
    <link rel="preload" href="/icons/icon-96.png" as="image" type="image/png">
    <link rel="preload" href="/icons/icon-192.png" as="image" type="image/png">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme-preference') || localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
