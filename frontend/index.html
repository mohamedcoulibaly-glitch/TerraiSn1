    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme-preference') || localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
