# TerrainSN — Nginx : domaines séparés (cible production)
# api.terrainsn.com → reverse-proxy backend :3000/:3001
# app.terrainsn.com → frontend-joueur/dist
# pro.terrainsn.com → frontend-pro/dist
#
# Prérequis : builds avec VITE_BASE=/ (défaut) pour chaque frontend.
# Certificats : certbot / Let's Encrypt.

upstream terrainsn_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

# --- API ---
server {
  listen 443 ssl http2;
  server_name api.terrainsn.com;

  # ssl_certificate     /etc/letsencrypt/live/api.terrainsn.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/api.terrainsn.com/privkey.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://terrainsn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

# --- Joueur PWA (app.terrainsn.com) ---
server {
  listen 443 ssl http2;
  server_name app.terrainsn.com;
  root /var/www/terrainsn/frontend-joueur/dist;
  index index.html;

  # ssl_certificate     /etc/letsencrypt/live/app.terrainsn.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/app.terrainsn.com/privkey.pem;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* (index\.html|sw\.js|workbox.*\.js|manifest\.webmanifest|manifest\.json)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}

# --- Pro PWA (pro.terrainsn.com) ---
server {
  listen 443 ssl http2;
  server_name pro.terrainsn.com;
  root /var/www/terrainsn/frontend-pro/dist;
  index index.html;

  # ssl_certificate     /etc/letsencrypt/live/pro.terrainsn.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/pro.terrainsn.com/privkey.pem;

  # Optionnel : restriction IP métiers
  # allow 41.82.0.0/16;
  # deny all;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* (index\.html|sw\.js|workbox.*\.js|manifest\.webmanifest|manifest\.json)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
